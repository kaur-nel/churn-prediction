project:
  random_seed: 42

paths:
  raw_data: data/raw/telco_churn.csv
  processed_dir: data/processed
  processed_data: data/processed/telco_clean.csv
  models_dir: models
  reports_dir: reports
  log_file: logs/churn.log

data:
  target: Churn
  id_column: customerID
  positive_label: "Yes"

split:
  train_size: 0.60
  val_size: 0.20
  test_size: 0.20

cv:
  n_splits: 5

# ASSUMPTIONS, not facts about the real company. Change them freely.
business:
  customer_ltv: 1000.0
  retention_offer_cost: 50.0
  offer_success_rate: 0.30
  sensitivity:               # values tried in the sensitivity table (every combination)
    customer_ltv: [500.0, 1000.0, 1500.0]
    retention_offer_cost: [25.0, 50.0, 100.0]
    offer_success_rate: [0.2, 0.3, 0.5]

models:
  logreg_drop_columns: ["TotalCharges"]   # features left out of logistic regression (VIF check)
  logreg:
    C: 1.0
    max_iter: 1000
  random_forest:
    n_estimators: 300
    max_depth: 8
    min_samples_leaf: 5
  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20

tuning:
  n_trials: 30
  models: ["random_forest", "logreg"]   # top 2 from Step 8 (a statistical tie with xgboost)
  search_space:
    random_forest:
      n_estimators: {type: int, low: 100, high: 500}
      max_depth: {type: int, low: 3, high: 16}
      min_samples_leaf: {type: int, low: 1, high: 30}
      max_features: {type: float, low: 0.2, high: 1.0}
    logreg:
      C: {type: float, low: 0.001, high: 100.0, log: true}
    xgboost:
      n_estimators: {type: int, low: 100, high: 600}
      learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
      max_depth: {type: int, low: 2, high: 8}
      subsample: {type: float, low: 0.6, high: 1.0}
      colsample_bytree: {type: float, low: 0.5, high: 1.0}
    lightgbm:
      n_estimators: {type: int, low: 100, high: 600}
      learning_rate: {type: float, low: 0.01, high: 0.3, log: true}
      num_leaves: {type: int, low: 8, high: 64}
      min_child_samples: {type: int, low: 10, high: 60}

# Step 9 showed tuning gave no real gain, so the final model uses the config defaults (params: {}).
# logreg and random_forest were statistically tied; logreg is the simpler model.
final:
  model: logreg
  strategy: baseline
  params: {}
  calibration_candidates: ["none", "sigmoid", "isotonic"]
  calibration_bins: 10
  min_brier_gain: 0.001   # a calibration fix must beat "none" by at least this much Brier score

# Final one-time evaluation on the test split (Step 12).
evaluation:
  n_bootstrap: 1000
  ci_level: 0.95
  calibration_bins: 10
  fairness_columns: ["gender", "SeniorCitizen"]
  min_group_positives: 30   # a group with fewer churners or non-churners than this is marked unreliable