project:
  random_seed: 42

paths:
  raw_data: data/raw/telco_churn.csv
  processed_dir: data/processed
  processed_data: data/processed/telco_clean.csv
  models_dir: models
  reports_dir: reports
  log_file: logs/churn.log

data:
  target: Churn
  id_column: customerID
  positive_label: "Yes"

split:
  train_size: 0.60
  val_size: 0.20
  test_size: 0.20

cv:
  n_splits: 5

# ASSUMPTIONS, not facts about the real company. Change them freely.
business:
  customer_ltv: 1000.0
  retention_offer_cost: 50.0
  offer_success_rate: 0.30

models:
  logreg_drop_columns: ["TotalCharges"]   # features left out of logistic regression (VIF check)
  logreg:
    C: 1.0
    max_iter: 1000
  random_forest:
    n_estimators: 300
    max_depth: 8
    min_samples_leaf: 5
  xgboost:
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 4
  lightgbm:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    min_child_samples: 20