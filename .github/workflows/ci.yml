name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest)
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Build the image
        run: docker build -t churn-prediction .
      - name: Health check inside the image
        run: docker run --rm churn-prediction python -m src.health
      - name: Score sample customers inside the image
        run: |
          mkdir out
          chmod 777 out
          docker run --rm \
            -v "${{ github.workspace }}/models:/app/models:ro" \
            -v "${{ github.workspace }}/reports:/app/reports:ro" \
            -v "${{ github.workspace }}/examples:/app/examples:ro" \
            -v "${{ github.workspace }}/out:/app/out" \
            churn-prediction \
            python -m src.predict --input examples/sample_customers.csv --output out/predictions.csv
          test "$(wc -l < out/predictions.csv)" -eq 6
          head -3 out/predictions.csv